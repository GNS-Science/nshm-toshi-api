# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: gnssciencenshm
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: nshm-toshi-api
service: nzshm22-toshi-api

plugins:
  - serverless-s3-local
  - serverless-dynamodb
  - serverless-plugin-warmup
  - serverless-plugin-ifelse
package:
  individually: false
  include:
    - graphql_api/**
  exclude:
    - .env
    - .env.*
    - .git/**
    - .github/**
    - .claude/**
    - .llm/**
    - .mypy_cache/**
    - .pytest_cache/**
    - .ruff_cache/**
    - .tox/**
    - .dynamodb/**
    - .serverless/**
    - .venv/**
    - .yarn/**
    - .coverage
    - .bumpversion.cfg
    - bin/**
    - docs/**
    - lib/**
    - node_modules/**
    - prof/**
    - spike/**
    - graphql_api/tests/**
    - graphql_api/tools/**
    - graphql_api/README.md
    - graphql_api/COVERAGE_GAPS.md
    - graphql_api/pyproject.toml
    - graphql_api/setup.cfg
    - graphql_api/uv.lock
    - auth/test_*
    - auth/tests/**
    - auth/cdk/**
    - auth/*.md
    - '**/__pycache__/**'
    - '**/*.pyc'
    - package.json
    - package-lock.json

custom:
  #serverless-python-requirements settings
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    slimPatterns:
      - '**/*.egg-info*'
    noDeploy:
      - boto3
      - botocore

  #serverless-s3-local settings
  s3:
    host: localhost
    directory: /tmp
  #dynamodb-local settings
  serverless-dynamodb:
  # If you only want to use DynamoDB Local in some stages, declare them here
    stages:
      - local
    start:
      port: 8000
      inMemory: true
      heapInitial: 200m
      heapMax: 1g
      sharedDb: true

  #Lambda warmer see https://www.serverless.com/plugins/serverless-plugin-warmup
  warmup:
    lowConcurrencyWarmer:
      enabled: true
      events:
        - schedule: rate(5 minutes)
      concurrency: 1

# DRY constants: define all compound/generated names in one place
# Override args are: .. defaults:
# --app_acroym          signed-uploader
# --s3_bucket           self:custom.app_acronym
# --s3_key_base         self:custom.stage
# --region              us-east-1
# --stage               test
# --deletion_policy     delete

  app_acronym: ${opt:acronym, self:service}
  default_stage: local
  stage: ${opt:stage, self:custom.default_stage}
  stack_name: ${self:custom.app_acronym}-${self:custom.stage}
  region: ${opt:region, self:provider.region}
  deletion_policy: Delete
  # Default to using app_acronym as bucket name
  s3_bucket: ${opt:s3_bucket, self:custom.app_acronym}-${self:custom.stage}
  # default to using ${stage} as key base path, keeps stages from namespace collisions
  s3_bucket_arn: arn:aws:s3:::${self:custom.s3_bucket}
  s3_role_resource: ${self:custom.s3_bucket_arn}
  # presigned URL TTL
  url_default_ttl: 60

  #elastic search
  esDomainName: ${self:custom.app_acronym}-es-${self:custom.stage}
  esIndex: toshi_index_mapped

  first_dynamo_id: ${env:FIRST_DYNAMO_ID, 100000}

  # ── Lambda concurrency cap ──────────────────────────────────────────────────
  # Without this the only limit is the account's pool of 1,000 concurrent Lambda
  # executions, shared by every function - so a flood of this endpoint can hold
  # the whole pool at 4 GB each, running up the bill and starving the rest.
  # Lambda does not queue synchronous requests: over the cap they are rejected
  # outright, and the client sees a 5xx.
  #
  # Sized against 15 months of prod traffic (to 2026-10): busiest hour 571
  # requests, graphql peak concurrency 4. Padded for runzi campaigns of several
  # hundred jobs starting or finishing together: 100 slots at ~140 ms a request
  # clear about 700 req/s. nshm-toshi-client retries 429 and 5xx six times, so a
  # brief rejection is a delay, not a failed job.
  #
  # The authorizer cap must not be lower than the graphql cap: every request goes
  # through the authorizer first. Each stage reserves its own slots out of the
  # account's 1,000.
  #
  # This does not limit the request rate. That is the stage throttle (50 req/s,
  # burst 500; over it clients get a 429), which Serverless cannot set on a REST
  # API stage: it is applied by hand, once per stage, with
  # scripts/stage_throttle.sh.
  reserved_concurrency: 100

  serverlessIfElse:
      # Test runs without its own ES domain. Only the resource is excluded: the ES
      # IAM statement below names the domain by constructed ARN rather than
      # Fn::GetAtt, so it does not dangle when the resource is gone. Excluding the
      # statement instead would need `provider.iamRoleStatements.1`, and the plugin
      # removes with `delete`, leaving a hole in the array that serialises to null
      # and fails validation. See #377.
      #
      # The graphql function's ES_ENDPOINT is a GetAtt on that resource, so it goes
      # too. Unset ES_ENDPOINT means indexing is off (graphql_api/data/search.py);
      # the other ES_* vars are inert without it. See #378.
      - If: '"${self:custom.stage}" == "test"'
        Exclude:
          - resources.Resources.ElasticSearchInstance
          - functions.graphql.environment.ES_ENDPOINT

provider:
  name: aws
  runtime: python3.12
  stage: ${opt:stage, 'dev'}
  region: ap-southeast-2
  environment:
    REGION: ${self:custom.region}
    S3_BUCKET_NAME: ${self:custom.s3_bucket}
    URL_DEFAULT_TTL: ${self:custom.url_default_ttl}
    DEPLOYMENT_STAGE: ${self:custom.stage}
  iamRoleStatements:
    # S3 access policy
    - Effect: Allow
      Action:
        - s3:*
      Resource:
        - ${self:custom.s3_role_resource}
        - ${self:custom.s3_role_resource}/*
    # ES access policy (#379). This role is how the graphql function reaches the
    # domain: its requests are SigV4-signed, and the domain policy defers to IAM.
    # Scoped to the one index it uses, with only the methods it uses:
    #   PUT  <index>/_doc/<id>     index_document — the live write path
    #   POST <index>/_search       search()
    #   GET  <index>/_search?q=    Query.search
    # Nothing at the domain root: no _bulk (the backfill script runs with operator
    # credentials, not this role), no index creation or deletion, no _cluster APIs.
    - Effect: Allow
      Action:
        - es:ESHttpPut
        - es:ESHttpPost
        - es:ESHttpGet
      # Constructed ARNs, not Fn::GetAtt, deliberately: the test stage excludes the
      # ElasticSearchInstance resource (see custom.serverlessIfElse), and a GetAtt on
      # an excluded resource fails template resolution. The value is identical to what
      # GetAtt produced. Do not revert to GetAtt.
      # Fn::Sub with the CFn pseudo-parameters, not ${aws:accountId}: the latter is a
      # Serverless variable resolved by calling AWS, which would make `sls package`
      # require live credentials. Same pattern as ToshiIdentityPoolRoleAttachment below.
      Resource:
        - Fn::Sub: arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${self:custom.esDomainName}/${self:custom.esIndex}/*
    -  Effect: Allow
       Action:
         - "cloudwatch:PutMetricData"
       Resource: "*"

    - Effect: Allow
      Action:
         - "dynamodb:Scan"
         - "dynamodb:Query"
         - "dynamodb:DescribeTable"
         - "dynamodb:CreateTable"
         - "dynamodb:GetItem"
         - "dynamodb:PutItem"
         - "dynamodb:ConditionCheckItem"
         - "dynamodb:UpdateItem"
      Resource: '*'

functions:
  # JWT Lambda Authorizer (auth — replaces x-api-key with Cognito JWTs)
  # COGNITO_USER_POOL_ID and COGNITO_CLIENT_ID are auto-wired from ToshiUserPool / ToshiScientistClient.
  jwtAuthorizer:
    handler: auth/authorizer/handler.handler
    description: Validates Cognito JWTs; accepts legacy x-api-key for backward compat
    memorySize: 512
    timeout: 10
    reservedConcurrency: ${self:custom.reserved_concurrency}
    environment:
      COGNITO_USER_POOL_ID: !Ref ToshiUserPool
      COGNITO_REGION: ${self:provider.region}
      COGNITO_CLIENT_ID:
        Fn::Join:
          - ','
          - - !Ref ToshiScientistClient
            - !Ref ToshiAutomationClient
      LEGACY_API_KEY: ${env:NZSHM22_TOSHI_API_KEY, env:LEGACY_API_KEY, ''}

  graphql:
    description: GraphQL API (Strawberry/FastAPI) at /graphql
    handler: graphql_api.app.handler
    memorySize: 4096
    timeout: 30
    reservedConcurrency: ${self:custom.reserved_concurrency}
    events:
      - http:
          path: graphql
          method: OPTIONS
      - http:
          path: graphql
          method: GET
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 0
            identitySource: ''
            type: request
      - http:
          path: graphql
          method: POST
          authorizer:
            name: jwtAuthorizer
            resultTtlInSeconds: 0
            identitySource: ''
            type: request
    environment:
      DEPLOYMENT_STAGE: ${self:custom.stage}
      GRAPHQL_PATH: /graphql
      # REGION + S3_BUCKET_NAME inherit from provider.environment but we set
      # S3_BUCKET_NAME explicitly so the dependency for _from_s3 / S3 fallback
      # paths in graphql_api/data/{dynamo,s3}.py is visible at function scope.
      S3_BUCKET_NAME: ${self:custom.s3_bucket}
      # Watermark for legacy_object_identities — IDs below this are S3-only.
      FIRST_DYNAMO_ID: ${self:custom.first_dynamo_id}
      # S3 IAM (s3:*) is inherited from provider.iamRoleStatements — covers
      # the s3:GetObject + s3:ListBucket needed by the read fallback paths.
      # Search indexing (#378). Writes go straight to the domain, SigV4-signed
      # with this function's role (es:ESHttp* in provider.iamRoleStatements) —
      # not through the GNS proxy that weka reads through. Removed on test by
      # custom.serverlessIfElse. graphql_api/tests/test_serverless_config.py guards these.
      ES_ENDPOINT: {"Fn::Join": ["", ["https://", {"Fn::GetAtt": ["ElasticSearchInstance", "DomainEndpoint"]}]]}
      ES_INDEX: ${self:custom.esIndex}
      ES_REGION: ${self:custom.region}
    warmup:
      lowConcurrencyWarmer:
        enabled: false

resources:
  Resources:
    ToshiBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.s3_bucket}

    # ── The prod search domain, as it actually is ───────────────────────────────
    # Adopted by CloudFormation resource import (#379), not created by a deploy.
    # Values are the live domain's, from docs/search-state-2026-09-21-prod.md.
    #
    # Type is AWS::OpenSearchService::Domain, not the AWS::Elasticsearch::Domain
    # this stack used to declare, for two reasons:
    #   - the legacy type cannot be imported at all: CloudFormation answers
    #     "ResourceTypes [AWS::Elasticsearch::Domain] are not supported for Import";
    #   - only the new type has EBSOptions.Throughput, so only it can describe this
    #     volume completely. The legacy type would have left the live 125 MiB/s as
    #     permanent drift.
    #
    # The engine does NOT change: EngineVersion takes `Elasticsearch_X.Y`, so this
    # stays Elasticsearch 7.10. Migrating the engine to OpenSearch is separate work.
    #
    # The logical id stays ElasticSearchInstance despite the type change: renaming it
    # would mean a second import, and the ES_ENDPOINT GetAtt and the test-stage
    # exclusion both reference it by that name.
    #
    # UpdatePolicy.EnableVersionUpgrade makes a future EngineVersion change an
    # in-place upgrade. Without it CloudFormation attempts *replacement*, which is
    # refused because DomainName is set — and a replacement that did succeed would
    # strand the data weka reads.
    #
    # Properties the live domain has and this block deliberately does not describe:
    # LogPublishingOptions, AdvancedOptions, SnapshotOptions, EncryptionAtRestOptions,
    # NodeToNodeEncryptionOptions. CloudFormation leaves absent properties alone.
    #
    # Access (#379 item 3, #386). The domain used to admit *unsigned* requests, with
    # es:* (deletes included), from one IP address, and accepted plain http. Every
    # legitimate client signs its requests with AWS credentials and uses https:
    #   - this service's graphql function  indexes   (provider.iamRoleStatements)
    #   - the nshm-weka-apigw function      searches  (its own role, in that repo)
    #   - operators running scripts/        maintain  (their own IAM permissions)
    # Each was confirmed with `aws iam simulate-principal-policy` to be admitted by
    # its own IAM policy, not by the IP rule, before the rule was removed.
    #
    # The account (its root) as principal means "defer to IAM": a principal in this
    # account gets in only if its own IAM policy allows it. Anonymous requests are
    # refused. What each client may do is therefore decided by its role, which is
    # why the graphql role above is scoped to one index.
    #
    # TLSSecurityPolicy is pinned to the live value. Leaving it out of an explicit
    # DomainEndpointOptions risks CloudFormation resetting it to the service default.
    ElasticSearchInstance:
      Type: AWS::OpenSearchService::Domain
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      UpdatePolicy:
        EnableVersionUpgrade: true
      Properties:
        EngineVersion: Elasticsearch_7.10
        DomainName: "${self:custom.esDomainName}"
        EBSOptions:
          EBSEnabled: true
          VolumeType: gp3
          VolumeSize: 50
          Iops: 3000
          Throughput: 125
        ClusterConfig:
          InstanceType: m7g.medium.search
          InstanceCount: 1
          DedicatedMasterEnabled: false
          ZoneAwarenessEnabled: false
        AccessPolicies:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                # The bare account id is the account root: AWS stores the
                # arn:aws:iam::<account>:root form in this shorter form, so the
                # template uses it too — otherwise drift detection sees a difference.
                AWS:
                  Ref: AWS::AccountId
              Action: es:ESHttp*
              Resource:
                Fn::Sub: arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${self:custom.esDomainName}/*
        DomainEndpointOptions:
          EnforceHTTPS: true
          TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07

    # ── Search indexing failure alarm (#378) ──────────────────────────────────
    # index_document() never raises, so a broken write path is otherwise silent.
    # It logs INDEX_FAILURE_MARKER (graphql_api/data/search.py) on every failure;
    # this counts those lines and alarms within the hour.
    #
    # The email subscription is added by hand in the SNS console, not here (the
    # shared deploy workflow cannot pass an address through). Topic ARN is in the
    # stack Outputs. Re-subscribe if this stack is ever rebuilt.
    IndexingAlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.stack_name}-indexing-alarm

    IndexingFailureMetricFilter:
      Type: AWS::Logs::MetricFilter
      Properties:
        LogGroupName: !Ref GraphqlLogGroup
        FilterPattern: '"ES_INDEX_FAILURE"'
        MetricTransformations:
          - MetricNamespace: ${self:custom.stack_name}
            MetricName: ESIndexFailures
            MetricValue: "1"

    IndexingFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:custom.stack_name}-es-index-failures
        # ASCII only. The CI deploy mangled the em dash that used to be here into
        # "?", so the deployed template could never match a locally generated one,
        # and a CloudFormation resource import refused to run: "You have modified
        # resources [IndexingFailureAlarm] in your template that are not being
        # imported". Keep template *values* ASCII; comments are free to use what
        # they like, since they never reach CloudFormation. See #379.
        AlarmDescription: >-
          graphql Lambda failed to write to Elasticsearch - weka search is going
          stale. Grep the graphql log group for ES_INDEX_FAILURE. See #378.
        Namespace: ${self:custom.stack_name}
        MetricName: ESIndexFailures
        Statistic: Sum
        Period: 3600
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref IndexingAlarmTopic

    # ── Cognito User Pool ──────────────────────────────────────────────────────
    # DeletionPolicy: Retain  # Uncomment for production to protect users on sls remove
    ToshiUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: toshi-${self:custom.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true

    ToshiResourceServer:
      Type: AWS::Cognito::UserPoolResourceServer
      Properties:
        UserPoolId: !Ref ToshiUserPool
        Identifier: toshi
        Name: Toshi API
        Scopes:
          - ScopeName: read
            ScopeDescription: Read access to GraphQL queries
          - ScopeName: write
            ScopeDescription: Write access to GraphQL mutations

    ToshiUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        # Domain prefix must be globally unique: toshi-{accountId}-{stage}
        Domain:
          Fn::Join:
            - '-'
            - - toshi
              - !Ref AWS::AccountId
              - ${self:custom.stage}
        UserPoolId: !Ref ToshiUserPool

    # Public client: scientists (USER_PASSWORD_AUTH → ~/.toshi/credentials)
    ToshiScientistClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: ToshiResourceServer
      Properties:
        ClientName: toshi-scientist
        UserPoolId: !Ref ToshiUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - openid
          - email
          - profile
          - toshi/read
          - toshi/write
        AllowedOAuthFlowsUserPoolClient: true
        SupportedIdentityProviders:
          - COGNITO
        CallbackURLs:
          - http://localhost:9999/callback
        LogoutURLs:
          - http://localhost:9999/logout
        RefreshTokenValidity: 30
        TokenValidityUnits:
          RefreshToken: days

    # Confidential client: automation / M2M (client_credentials grant)
    # Secret cannot be a CFn Output (security). Retrieve via:
    #   aws cognito-idp describe-user-pool-client \
    #     --user-pool-id <UserPoolId> --client-id <AutomationClientId>
    ToshiAutomationClient:
      Type: AWS::Cognito::UserPoolClient
      DependsOn: ToshiResourceServer
      Properties:
        ClientName: toshi-automation
        UserPoolId: !Ref ToshiUserPool
        GenerateSecret: true
        AllowedOAuthFlows:
          - client_credentials
        AllowedOAuthScopes:
          - toshi/read
          - toshi/write
        AllowedOAuthFlowsUserPoolClient: true

    # ── Cognito user groups ────────────────────────────────────────────────────
    ToshiGroupWriters:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: toshi-writers
        Description: Users with toshi/read + toshi/write access
        UserPoolId: !Ref ToshiUserPool

    ToshiGroupReaders:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: toshi-readers
        Description: Users with toshi/read access only
        UserPoolId: !Ref ToshiUserPool

    ToshiGroupRunziLocal:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: runzi-local
        Description: Runzi workstation users (ECR pull, S3 read/write)
        UserPoolId: !Ref ToshiUserPool

    ToshiGroupRunziBatch:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: runzi-batch
        Description: Runzi batch job users (+ Batch submit/describe)
        UserPoolId: !Ref ToshiUserPool

    ToshiGroupRunziAdmin:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        GroupName: runzi-admin
        Description: Runzi admin users (+ Batch configure, ECR push/create)
        UserPoolId: !Ref ToshiUserPool

    # ── Cognito Identity Pool ──────────────────────────────────────────────────
    ToshiIdentityPool:
      Type: AWS::Cognito::IdentityPool
      Properties:
        IdentityPoolName: toshi-identity-${self:custom.stage}
        AllowUnauthenticatedIdentities: false
        CognitoIdentityProviders:
          - ProviderName: !GetAtt ToshiUserPool.ProviderName
            ClientId: !Ref ToshiScientistClient
            ServerSideTokenCheck: false

    # ── Identity Pool role attachment (rules-based by Cognito group) ───────────
    # Role references below are Fn::Sub ARN STRINGS, not !GetAtt, deliberately: the
    # ToshiRunzi{Local,Batch,Admin}Role resources (and the three managed policies) have been
    # migrated to nzshm-runzi's terraform/access/ (see docs/architecture/adr/0005-... in that
    # repo) and removed from this template. This Identity Pool + its attachment stay here. Fn::Sub
    # keeps the attachment working (the live ARN value is identical to what !GetAtt produced)
    # without depending on resources that no longer live in this stack. Do not revert to !GetAtt.
    ToshiIdentityPoolRoleAttachment:
      Type: AWS::Cognito::IdentityPoolRoleAttachment
      Properties:
        IdentityPoolId: !Ref ToshiIdentityPool
        Roles:
          authenticated:
            Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/toshi-runzi-local-${self:custom.stage}
        RoleMappings:
          ToshiProvider:
            IdentityProvider:
              Fn::Join:
                - ':'
                - - !GetAtt ToshiUserPool.ProviderName
                  - !Ref ToshiScientistClient
            Type: Rules
            AmbiguousRoleResolution: AuthenticatedRole
            RulesConfiguration:
              # Rules are evaluated in order and the FIRST match wins (the Identity
              # Pool can only assign one role). They MUST be ordered most-privileged
              # first so a user in several runzi-* groups gets their HIGHEST tier.
              # Each tier's role is cumulative (admin ⊃ batch ⊃ local), so one role
              # is sufficient — do not reorder these without understanding that.
              Rules:
                - Claim: cognito:groups
                  MatchType: Contains
                  Value: runzi-admin
                  RoleARN:
                    Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/toshi-runzi-admin-${self:custom.stage}
                - Claim: cognito:groups
                  MatchType: Contains
                  Value: runzi-batch
                  RoleARN:
                    Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/toshi-runzi-batch-${self:custom.stage}
                - Claim: cognito:groups
                  MatchType: Contains
                  Value: runzi-local
                  RoleARN:
                    Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/toshi-runzi-local-${self:custom.stage}

    # ── Secrets Manager: Cognito M2M client_id/client_secret container ─────────
    # Populated out-of-band by `auth/create_m2m_secret.py` after the Cognito
    # automation app client is minted. Consumers (Runzi) read this via
    # `nshm_toshi_client.ToshiTokenManager(secret_arn=...)`.
    ToshiM2MSecret:
      Type: AWS::SecretsManager::Secret
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        Name: toshi-m2m-${self:custom.stage}
        Description: Cognito M2M client_id + client_secret for ${self:custom.stage} (populated out-of-band by auth/create_m2m_secret.py)

  Outputs:
    IndexingAlarmTopicArn:
      Description: SNS topic for the ES indexing failure alarm (subscribe an email by hand in the SNS console)
      Value: !Ref IndexingAlarmTopic
    UserPoolId:
      Description: Cognito User Pool ID (set as COGNITO_USER_POOL_ID env var)
      Value: !Ref ToshiUserPool
    IdentityPoolId:
      Description: Cognito Identity Pool ID (for aws-creds exchange)
      Value: !Ref ToshiIdentityPool
    ScientistClientId:
      Description: Public app client for scientist login
      Value: !Ref ToshiScientistClient
    AutomationClientId:
      Description: Confidential app client for M2M (secret fetched separately)
      Value: !Ref ToshiAutomationClient
    CognitoDomain:
      Description: Cognito hosted UI domain (token endpoint base URL)
      Value:
        Fn::Join:
          - ''
          - - !Ref ToshiUserPoolDomain
            - .auth.
            - !Ref AWS::Region
            - .amazoncognito.com
    Issuer:
      Description: JWT issuer URL (for authorizer handler.py COGNITO_USER_POOL_ID verification)
      Value:
        Fn::Join:
          - ''
          - - 'https://cognito-idp.'
            - !Ref AWS::Region
            - .amazonaws.com/
            - !Ref ToshiUserPool
    JwksUri:
      Description: JWKS endpoint for JWT signature verification
      Value:
        Fn::Join:
          - ''
          - - 'https://cognito-idp.'
            - !Ref AWS::Region
            - .amazonaws.com/
            - !Ref ToshiUserPool
            - /.well-known/jwks.json
    M2MSecretArn:
      Description: ARN of the SM secret holding Cognito M2M client_id/client_secret (set NZSHM22_TOSHI_M2M_SECRET_ARN to this)
      Value: !Ref ToshiM2MSecret
    M2MSecretName:
      Description: Name of the SM secret (use with auth/create_m2m_secret.py --secret-name)
      Value: toshi-m2m-${self:custom.stage}
